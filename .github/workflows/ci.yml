name: CI/CD Pipeline

on:
  push:
    branches: [main, MAP_V2_Development]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Lint with ruff
        run: ruff check app/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: migration_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          ENGINE_DB_HOST: localhost
          ENGINE_DB_PORT: 5432
          ENGINE_DB_NAME: migration_engine
          ENGINE_DB_USER: postgres
          ENGINE_DB_PASS: test_password
          JWT_SECRET_KEY: test_secret_key_for_ci_only
          APP_ADMIN_USER: admin@test.com
          APP_ADMIN_PASS: test123
        run: |
          python -m pytest tests/ -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/MAP_V2_Development'
    steps:
      - uses: actions/checkout@v4
      - name: Build notification
        run: echo "Build successful - ready for deployment"
