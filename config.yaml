project_id: "ae40b96c-20da-4972-bb29-bff3c2451ae0"

database:
  host: ${DB_HOST:-localhost}
  port: ${DB_PORT:-5432}
  dbname: ${DB_NAME:-postgres}
  user: ${DB_USER:-postgres}
  password: ${DB_PASS:-dev123456}


engine_db:
  host: ${ENGINE_DB_HOST:-localhost}
  port: ${ENGINE_DB_PORT:-5432}
  database: ${ENGINE_DB_NAME:-migration_engine}
  user: ${ENGINE_DB_USER:-postgres}
  password: ${ENGINE_DB_PASS:-dev123456}

source_db:
  type: postgres   # ✅ ADD THIS
  host: ${SOURCE_DB_HOST:-localhost}
  port: ${SOURCE_DB_PORT:-5432}
  database: ${SOURCE_DB_NAME:-migration_source}
  user: ${SOURCE_DB_USER:-postgres}
  password: ${SOURCE_DB_PASS:-dev123456}

target_db:
  host: ${TARGET_DB_HOST:-localhost}
  port: ${TARGET_DB_PORT:-5432}
  database: ${TARGET_DB_NAME:-migration_target}
  user: ${TARGET_DB_USER:-postgres}
  password: ${TARGET_DB_PASS:-dev123456}

execution:
  environment: DEV
  client_name: DemoBank
  control_id: null   # null = run all controls

release_gate:
  enabled: true
  block_on_status: ["FAIL", "BLOCKED", "ERROR"]
  minimum_score: 80
  enforcement_mode: "STRICT"   # STRICT | RECORD_ONLY

rules:

  C01: enabled
  C02: enabled
  C03: enabled
  C04: enabled
  C05: enabled
  C06: enabled
  C07: enabled
  C08: disabled
  C09: enabled
  C010: enabled



#rules:
#  C01: enabled
#  C02: enabled
#  C03: enabled
#  C04: enabled
#  C05: disabled
#  C06: disabled
#  C07: disabled
#  C08: disabled
#  C09: enabled
#  C010: enabled


# phase 7 steps 3
# # Failure isolation: continue executing other controls
engine:
  control_timeout_seconds: 300


##Meaning:
#Define dependency
#C02 runs only after C01
#C09 runs only after C03
#If a control is not listed → no dependencies.
#Step 5: Control Dependency Graph (DAG)
control_dependencies:

  C02:
    - C01

  C09:
    - C03

encryption_keys:
  env-key-1: "YOUR_FERNET_BASE64_KEY_HERE"

  
