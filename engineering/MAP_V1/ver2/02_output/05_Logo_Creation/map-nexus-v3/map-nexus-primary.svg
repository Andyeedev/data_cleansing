<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100">
  <rect width="360" height="100" fill="white"/>
  <!-- MAP Nexus V3 Primary Horizontal -->
  <!-- Pathways with intentional colour hierarchy -->
  <line x1="16" y1="14" x2="50" y2="58" stroke="#667EEA" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="50" y1="4" x2="50" y2="58" stroke="#764BA2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="84" y1="14" x2="50" y2="58" stroke="#667EEA" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Validation Node - Hero Element -->
  <circle cx="50" cy="74" r="14" fill="#3B82F6"/>
  <circle cx="50" cy="74" r="8" fill="white" opacity="0.25"/>
  <circle cx="50" cy="74" r="3" fill="white" opacity="0.4"/>
  <!-- Wordmark: MAP - dominant -->
  <text x="110" y="48" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="700" fill="#1F2937" letter-spacing="1.5">MAP</text>
  <!-- Wordmark: NEXUS - secondary brand -->
  <text x="186" y="48" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="300" fill="#6B7280" letter-spacing="1.5">NEXUS</text>
  <!-- Subtitle - understated -->
  <text x="110" y="72" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9CA3AF" letter-spacing="2.5">MIGRATION ASSURANCE PLATFORM</text>
</svg>
