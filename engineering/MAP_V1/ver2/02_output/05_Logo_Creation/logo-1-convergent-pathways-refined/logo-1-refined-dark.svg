  <line x1="12" y1="12" x2="44" y2="56" stroke="#818CF8" stroke-width="8" stroke-linecap="round"/>
  <line x1="44" y1="4" x2="44" y2="56" stroke="#A78BFA" stroke-width="8" stroke-linecap="round"/>
  <line x1="76" y1="12" x2="44" y2="56" stroke="#818CF8" stroke-width="8" stroke-linecap="round"/>
  <!-- Convergence node -->
