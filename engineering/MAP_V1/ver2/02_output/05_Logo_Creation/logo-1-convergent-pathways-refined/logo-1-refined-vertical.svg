<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180">
  <rect width="160" height="180" fill="white"/>
  <!-- Icon: Refined converging pathways -->
  <line x1="30" y1="20" x2="80" y2="90" stroke="#667EEA" stroke-width="8" stroke-linecap="round"/>
  <line x1="80" y1="8" x2="80" y2="90" stroke="#764BA2" stroke-width="8" stroke-linecap="round"/>
  <line x1="130" y1="20" x2="80" y2="90" stroke="#667EEA" stroke-width="8" stroke-linecap="round"/>
  <!-- Convergence node -->
  <circle cx="80" cy="110" r="12" fill="#3B82F6"/>
  <circle cx="80" cy="110" r="5" fill="white" opacity="0.3"/>
  <!-- Wordmark -->
  <text x="80" y="150" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#1F2937" letter-spacing="1" text-anchor="middle">MAP</text>
  <text x="80" y="170" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#6B7280" letter-spacing="1.5" text-anchor="middle">MIGRATION ASSURANCE PLATFORM</text>
</svg>
