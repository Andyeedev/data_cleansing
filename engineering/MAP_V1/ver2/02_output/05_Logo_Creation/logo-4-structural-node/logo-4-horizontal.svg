  <line x1="10" y1="40" x2="40" y2="40" stroke="#667EEA" stroke-width="1.5" opacity="0.5"/>
  <line x1="10" y1="10" x2="10" y2="40" stroke="#667EEA" stroke-width="1.5" opacity="0.5"/>
