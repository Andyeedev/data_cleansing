<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667EEA"/>
      <stop offset="100%" stop-color="#764BA2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="280" height="80" fill="white"/>
  <!-- Icon: Three converging paths -->
  <line x1="15" y1="15" x2="40" y2="50" stroke="#667EEA" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="8" x2="40" y2="50" stroke="#764BA2" stroke-width="6" stroke-linecap="round"/>
  <line x1="65" y1="15" x2="40" y2="50" stroke="#667EEA" stroke-width="6" stroke-linecap="round"/>
  <!-- Convergence point -->
  <circle cx="40" cy="58" r="8" fill="#3B82F6"/>
  <!-- Wordmark: MAP -->
  <text x="85" y="42" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1F2937" letter-spacing="-0.5">MAP</text>
  <!-- Subtitle -->
  <text x="85" y="60" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#6B7280" letter-spacing="0.5">MIGRATION ASSURANCE PLATFORM</text>
</svg>
