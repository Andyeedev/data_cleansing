<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>MAP Nexus™ — Feature Callout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1200px; height: 800px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: #F8F9FB; display: flex; align-items: center; justify-content: center; }
    .callout { display: flex; gap: 48px; padding: 0 80px; align-items: center; }
    .icon { width: 120px; height: 120px; background: linear-gradient(135deg, #0078D4 0%, #003B75 100%); border-radius: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon svg { width: 56px; height: 56px; stroke: #fff; fill: none; stroke-width: 2; }
    .text h3 { font-size: 32px; font-weight: 700; color: #0B2447; margin-bottom: 12px; }
    .text p { font-size: 18px; color: #424242; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="callout">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
    <div class="text">
      <h3>Automated Validation</h3>
      <p>Execute 9 validation controls with 27 rules across your migration pipeline. Real-time results with governance decision tracking and executive reporting.</p>
    </div>
  </div>
</body>
</html>
