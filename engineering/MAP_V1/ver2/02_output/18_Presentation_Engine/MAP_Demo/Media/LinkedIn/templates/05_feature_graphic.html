<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Feature Graphic</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: #F8F9FB; display: flex; align-items: center; justify-content: center; }
    .post { display: flex; gap: 60px; padding: 0 120px; align-items: center; }
    .left { flex: 1; }
    .left h2 { font-size: 48px; font-weight: 700; color: #0B2447; margin-bottom: 16px; }
    .left h2 span { color: #0078D4; font-weight: 300; }
    .left p { font-size: 18px; color: #424242; line-height: 1.6; }
    .right { display: flex; flex-direction: column; gap: 16px; }
    .tile { background: #fff; border-radius: 12px; padding: 20px 24px; border: 1px solid #E5E7EB; width: 300px; }
    .tile h4 { font-size: 15px; font-weight: 600; color: #0B2447; }
    .tile p { font-size: 12px; color: #6B7280; }
  </style>
</head>
<body>
  <div class="post">
    <div class="left">
      <h2>Key <span>Features</span></h2>
      <p>Enterprise-grade validation, governance, and risk assessment for data migrations.</p>
    </div>
    <div class="right">
      <div class="tile"><h4>Automated Validation</h4><p>9 controls, 27 rules</p></div>
      <div class="tile"><h4>Governance</h4><p>Complete audit trail</p></div>
      <div class="tile"><h4>Risk Assessment</h4><p>Go/no-go decisions</p></div>
      <div class="tile"><h4>Data Quality</h4><p>6-dimension analysis</p></div>
    </div>
  </div>
</body>
</html>
