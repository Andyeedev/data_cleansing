<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>MAP Nexus™ — LinkedIn Portrait</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: linear-gradient(180deg, #0078D4 0%, #003B75 100%); display: flex; align-items: center; justify-content: center; color: #fff; }
    .post { text-align: center; padding: 60px; }
    .badge { display: inline-block; background: rgba(255,255,255,0.2); font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; }
    h1 { font-size: 56px; font-weight: 700; margin-bottom: 8px; }
    h1 span { font-weight: 300; }
    .sub { font-size: 20px; opacity: 0.85; margin-bottom: 40px; }
    .features { text-align: left; max-width: 600px; margin: 0 auto; }
    .feature { display: flex; gap: 16px; margin-bottom: 20px; }
    .feature-dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; margin-top: 8px; flex-shrink: 0; }
    .feature p { font-size: 16px; opacity: 0.9; }
  </style>
</head>
<body>
  <div class="post">
    <div class="badge">Enterprise Data Migration</div>
    <h1>MAP <span>Nexus™</span></h1>
    <div class="sub">Migration Assurance Platform</div>
    <div class="features">
      <div class="feature"><div class="feature-dot"></div><p>Automated validation controls</p></div>
      <div class="feature"><div class="feature-dot"></div><p>Governance and audit trail</p></div>
      <div class="feature"><div class="feature-dot"></div><p>Risk assessment and go/no-go</p></div>
      <div class="feature"><div class="feature-dot"></div><p>Data quality analysis</p></div>
      <div class="feature"><div class="feature-dot"></div><p>Executive-ready dashboards</p></div>
    </div>
  </div>
</body>
</html>
