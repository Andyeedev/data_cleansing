<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — LinkedIn Landscape</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: linear-gradient(135deg, #0078D4 0%, #003B75 100%); display: flex; align-items: center; justify-content: center; color: #fff; }
    .post { text-align: center; max-width: 1200px; }
    .badge { display: inline-block; background: rgba(255,255,255,0.2); font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; }
    h1 { font-size: 64px; font-weight: 700; margin-bottom: 8px; }
    h1 span { font-weight: 300; }
    .sub { font-size: 22px; opacity: 0.85; margin-bottom: 32px; }
    .stats { display: flex; justify-content: center; gap: 24px; }
    .stat { background: rgba(255,255,255,0.12); border-radius: 10px; padding: 16px 24px; }
    .stat .val { font-size: 28px; font-weight: 700; }
    .stat .lbl { font-size: 12px; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="post">
    <div class="badge">Introducing</div>
    <h1>MAP <span>Nexus™</span></h1>
    <div class="sub">Migration Assurance Platform — Validate, Govern, Succeed</div>
    <div class="stats">
      <div class="stat"><div class="val">9</div><div class="lbl">Controls</div></div>
      <div class="stat"><div class="val">27</div><div class="lbl">Rules</div></div>
      <div class="stat"><div class="val">6</div><div class="lbl">Dimensions</div></div>
      <div class="stat"><div class="val">100%</div><div class="lbl">Offline</div></div>
    </div>
  </div>
</body>
</html>
