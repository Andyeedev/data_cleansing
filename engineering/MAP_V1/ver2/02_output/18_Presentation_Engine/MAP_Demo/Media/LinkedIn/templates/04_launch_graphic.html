<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Launch Graphic</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: linear-gradient(135deg, #107C10 0%, #0B6B0B 100%); display: flex; align-items: center; justify-content: center; color: #fff; }
    .post { text-align: center; }
    .badge { display: inline-block; background: rgba(255,255,255,0.2); font-size: 14px; font-weight: 600; padding: 6px 16px; border-radius: 24px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; }
    h1 { font-size: 72px; font-weight: 700; margin-bottom: 8px; }
    h1 span { font-weight: 300; }
    .sub { font-size: 24px; opacity: 0.85; margin-bottom: 32px; }
    .tag { font-size: 18px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="post">
    <div class="badge">Now Available</div>
    <h1>MAP <span>Nexus™</span></h1>
    <div class="sub">Migration Assurance Platform — Enterprise Demonstration</div>
    <div class="tag">Available on Microsoft Marketplace</div>
  </div>
</body>
</html>
