<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>MAP Nexus™ — LinkedIn Square</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: linear-gradient(135deg, #0078D4 0%, #003B75 100%); display: flex; align-items: center; justify-content: center; color: #fff; }
    .post { text-align: center; padding: 60px; }
    .badge { display: inline-block; background: rgba(255,255,255,0.2); font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
    h1 { font-size: 56px; font-weight: 700; margin-bottom: 8px; }
    h1 span { font-weight: 300; }
    .sub { font-size: 18px; opacity: 0.85; margin-bottom: 32px; }
    .stats { display: flex; justify-content: center; gap: 16px; }
    .stat { background: rgba(255,255,255,0.12); border-radius: 8px; padding: 12px 20px; }
    .stat .val { font-size: 24px; font-weight: 700; }
    .stat .lbl { font-size: 11px; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="post">
    <div class="badge">Migration Assurance</div>
    <h1>MAP <span>Nexus™</span></h1>
    <div class="sub">Enterprise Data Migration Validation</div>
    <div class="stats">
      <div class="stat"><div class="val">9</div><div class="lbl">Controls</div></div>
      <div class="stat"><div class="val">27</div><div class="lbl">Rules</div></div>
      <div class="stat"><div class="val">100%</div><div class="lbl">Offline</div></div>
    </div>
  </div>
</body>
</html>
