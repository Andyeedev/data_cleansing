<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Roadmap Graphic</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: #F8F9FB; display: flex; flex-direction: column; }
    .header { padding: 60px 80px 0; }
    .header h2 { font-size: 42px; font-weight: 700; color: #0B2447; }
    .header h2 span { color: #0078D4; font-weight: 300; }
    .roadmap { flex: 1; padding: 40px 80px; display: flex; gap: 20px; align-items: center; }
    .phase { background: #fff; border-radius: 12px; padding: 24px; border: 1px solid #E5E7EB; flex: 1; border-top: 4px solid; text-align: center; }
    .phase.done { border-top-color: #107C10; }
    .phase.active { border-top-color: #0078D4; }
    .phase.planned { border-top-color: #9CA3AF; }
    .phase h4 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .phase .status { font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .phase.done .status { color: #107C10; }
    .phase.active .status { color: #0078D4; }
    .phase.planned .status { color: #9CA3AF; }
  </style>
</head>
<body>
  <div class="header"><h2>Product <span>Roadmap</span></h2></div>
  <div class="roadmap">
    <div class="phase done"><h4>Phase 1</h4><div class="status">Done</div></div>
    <div class="phase done"><h4>Phase 2</h4><div class="status">Done</div></div>
    <div class="phase active"><h4>Phase 3</h4><div class="status">Active</div></div>
    <div class="phase planned"><h4>Phase 4</h4><div class="status">Planned</div></div>
  </div>
</body>
</html>
