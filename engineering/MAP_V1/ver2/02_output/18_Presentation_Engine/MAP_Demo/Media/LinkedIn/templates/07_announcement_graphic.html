<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Announcement Graphic</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: linear-gradient(135deg, #5C2D91 0%, #3B1A6B 100%); display: flex; align-items: center; justify-content: center; color: #fff; }
    .post { text-align: center; max-width: 1000px; }
    .badge { display: inline-block; background: rgba(255,255,255,0.2); font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; }
    h1 { font-size: 64px; font-weight: 700; margin-bottom: 16px; }
    h1 span { font-weight: 300; }
    .sub { font-size: 22px; opacity: 0.85; margin-bottom: 32px; }
    .features { display: flex; justify-content: center; gap: 32px; }
    .feature { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 16px 24px; }
    .feature p { font-size: 14px; }
  </style>
</head>
<body>
  <div class="post">
    <div class="badge">New Release</div>
    <h1>MAP <span>Nexus™</span></h1>
    <div class="sub">Version 2.0 — Enhanced Validation and Governance</div>
    <div class="features">
      <div class="feature"><p>New Validation Controls</p></div>
      <div class="feature"><p>Enhanced Governance</p></div>
      <div class="feature"><p>Improved Dashboards</p></div>
    </div>
  </div>
</body>
</html>
