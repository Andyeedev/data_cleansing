<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Homepage Hero</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: linear-gradient(135deg, #0078D4 0%, #003B75 100%); display: flex; align-items: center; justify-content: center; color: #fff; }
    .hero { text-align: center; max-width: 900px; }
    .badge { display: inline-block; background: rgba(255,255,255,0.2); font-size: 12px; font-weight: 600; padding: 6px 16px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; }
    h1 { font-size: 72px; font-weight: 700; margin-bottom: 8px; }
    h1 span { font-weight: 300; }
    .subtitle { font-size: 24px; opacity: 0.85; margin-bottom: 40px; }
    .stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 40px; }
    .stat { background: rgba(255,255,255,0.12); border-radius: 12px; padding: 20px 32px; min-width: 160px; }
    .stat-value { font-size: 36px; font-weight: 700; }
    .stat-label { font-size: 13px; opacity: 0.8; margin-top: 4px; }
    .cta { display: inline-block; background: #fff; color: #0078D4; padding: 16px 40px; border-radius: 8px; font-size: 16px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="badge">Enterprise Data Migration Assurance</div>
    <h1>MAP <span>Nexus™</span></h1>
    <div class="subtitle">Migration Assurance Platform</div>
    <div class="stats">
      <div class="stat"><div class="stat-value">62%</div><div class="stat-label">Readiness</div></div>
      <div class="stat"><div class="stat-value">9</div><div class="stat-label">Controls</div></div>
      <div class="stat"><div class="stat-value">27s</div><div class="stat-label">Execution</div></div>
      <div class="stat"><div class="stat-value">100%</div><div class="stat-label">Offline</div></div>
    </div>
    <div class="cta">Explore the Platform →</div>
  </div>
</body>
</html>
