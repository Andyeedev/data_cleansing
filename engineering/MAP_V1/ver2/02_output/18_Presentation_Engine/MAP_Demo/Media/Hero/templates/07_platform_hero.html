<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Platform Overview Hero</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: linear-gradient(135deg, #0078D4 0%, #003B75 50%, #0B2447 100%); display: flex; align-items: center; justify-content: center; color: #fff; }
    .hero { text-align: center; max-width: 1000px; }
    .badge { display: inline-block; background: rgba(255,255,255,0.2); font-size: 12px; font-weight: 600; padding: 6px 16px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; }
    h1 { font-size: 64px; font-weight: 700; margin-bottom: 8px; }
    h1 span { font-weight: 300; }
    .subtitle { font-size: 22px; opacity: 0.85; margin-bottom: 48px; }
    .features { display: flex; justify-content: center; gap: 40px; margin-bottom: 48px; }
    .feature { text-align: center; }
    .feature-icon { width: 64px; height: 64px; background: rgba(255,255,255,0.12); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
    .feature-icon svg { width: 32px; height: 32px; stroke: #fff; fill: none; stroke-width: 2; }
    .feature h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .feature p { font-size: 13px; opacity: 0.7; }
    .cta { display: inline-block; background: #fff; color: #0078D4; padding: 16px 40px; border-radius: 8px; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="badge">Enterprise Data Migration Assurance</div>
    <h1>MAP <span>Nexus™</span></h1>
    <div class="subtitle">End-to-end validation, governance, and risk assessment for data migrations</div>
    <div class="features">
      <div class="feature">
        <div class="feature-icon"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
        <h3>Validation</h3><p>Automated controls</p>
      </div>
      <div class="feature">
        <div class="feature-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
        <h3>Governance</h3><p>Audit trail</p>
      </div>
      <div class="feature">
        <div class="feature-icon"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg></div>
        <h3>Risk</h3><p>Assessment</p>
      </div>
      <div class="feature">
        <div class="feature-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div>
        <h3>Quality</h3><p>Dimensions</p>
      </div>
      <div class="feature">
        <div class="feature-icon"><svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div>
        <h3>Progress</h3><p>Tracking</p>
      </div>
    </div>
    <div class="cta">Explore the Platform →</div>
  </div>
</body>
</html>
