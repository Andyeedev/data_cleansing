<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Executive Dashboard Hero</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: #F8F9FB; display: flex; }
    .left { width: 50%; background: linear-gradient(135deg, #0078D4 0%, #003B75 100%); display: flex; flex-direction: column; justify-content: center; padding: 80px; color: #fff; }
    .left h2 { font-size: 48px; font-weight: 700; margin-bottom: 16px; }
    .left h2 span { font-weight: 300; }
    .left p { font-size: 18px; opacity: 0.85; line-height: 1.6; margin-bottom: 32px; }
    .kpi-row { display: flex; gap: 16px; }
    .kpi { background: rgba(255,255,255,0.12); border-radius: 10px; padding: 16px 24px; }
    .kpi-val { font-size: 28px; font-weight: 700; }
    .kpi-lbl { font-size: 12px; opacity: 0.8; }
    .right { width: 50%; padding: 60px; display: flex; flex-direction: column; justify-content: center; }
    .donut { width: 300px; height: 300px; border-radius: 50%; background: conic-gradient(#107C10 0% 22%, #D13438 22% 33%, #FFB900 33% 89%, #0078D4 89% 100%); margin: 0 auto; position: relative; }
    .donut::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 180px; height: 180px; background: #F8F9FB; border-radius: 50%; }
    .legend { display: flex; justify-content: center; gap: 20px; margin-top: 24px; font-size: 14px; color: #424242; }
  </style>
</head>
<body>
  <div class="left">
    <h2>Executive <span>Dashboard</span></h2>
    <p>Real-time visibility into migration status, validation controls, and governance decisions. Executive-ready reporting for stakeholders at every level.</p>
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-val">9</div><div class="kpi-lbl">Controls</div></div>
      <div class="kpi"><div class="kpi-val">2</div><div class="kpi-lbl">Passed</div></div>
      <div class="kpi"><div class="kpi-val">5</div><div class="kpi-lbl">Errors</div></div>
      <div class="kpi"><div class="kpi-val">1</div><div class="kpi-lbl">Blocked</div></div>
    </div>
  </div>
  <div class="right">
    <div class="donut"></div>
    <div class="legend">
      <span><span style="display:inline-block;width:12px;height:12px;background:#107C10;border-radius:3px;margin-right:6px;"></span>Passed</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:#D13438;border-radius:3px;margin-right:6px;"></span>Failed</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:#FFB900;border-radius:3px;margin-right:6px;"></span>Error</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:#0078D4;border-radius:3px;margin-right:6px;"></span>Blocked</span>
    </div>
  </div>
</body>
</html>
