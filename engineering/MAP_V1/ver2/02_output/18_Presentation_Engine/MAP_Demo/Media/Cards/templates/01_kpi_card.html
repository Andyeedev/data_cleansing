<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800">
  <title>MAP Nexus — KPI Card</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 800px; height: 400px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: #F8F9FB; display: flex; align-items: center; justify-content: center; }
    .kpi-card { background: #fff; border-radius: 16px; padding: 40px; border: 1px solid #E5E7EB; border-left: 6px solid #0078D4; text-align: center; width: 400px; }
    .kpi-card.success { border-left-color: #107C10; }
    .kpi-card.warning { border-left-color: #FFB900; }
    .kpi-card.error { border-left-color: #D13438; }
    .kpi-value { font-size: 56px; font-weight: 700; color: #0B2447; }
    .kpi-label { font-size: 16px; color: #6B7280; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="kpi-card">
    <div class="kpi-value">58.3%</div>
    <div class="kpi-label">Validation Score</div>
  </div>
</body>
</html>
