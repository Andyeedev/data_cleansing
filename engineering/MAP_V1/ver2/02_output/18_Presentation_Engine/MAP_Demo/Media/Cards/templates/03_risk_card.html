<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800">
  <title>MAP Nexus — Risk Card</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 800px; height: 400px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: #F8F9FB; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 16px; padding: 32px; border: 1px solid #E5E7EB; border-left: 6px solid #D13438; width: 500px; }
    .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #FDECEA; color: #D13438; margin-bottom: 12px; }
    .card p { font-size: 14px; color: #424242; line-height: 1.6; }
    .meta { margin-top: 12px; font-size: 12px; color: #6B7280; }
  </style>
</head>
<body>
  <div class="card">
    <h3>R-001: Data loss during migration</h3>
    <span class="badge">CRITICAL</span>
    <p>Permanent data loss risk. Mitigation: Implement incremental backup before migration.</p>
    <div class="meta">Owner: Data Team · Status: OPEN</div>
  </div>
</body>
</html>
