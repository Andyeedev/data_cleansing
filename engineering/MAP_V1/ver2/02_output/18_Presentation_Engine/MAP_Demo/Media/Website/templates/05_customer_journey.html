<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Customer Journey</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 500px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: #F8F9FB; display: flex; align-items: center; justify-content: center; }
    .journey { display: flex; align-items: center; gap: 24px; padding: 0 80px; }
    .step { background: #fff; border-radius: 12px; padding: 28px 24px; border: 1px solid #E5E7EB; text-align: center; width: 220px; }
    .step-num { width: 40px; height: 40px; background: #0078D4; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; margin: 0 auto 12px; }
    .step h4 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .step p { font-size: 12px; color: #6B7280; }
    .arrow { font-size: 32px; color: #0078D4; }
  </style>
</head>
<body>
  <div class="journey">
    <div class="step"><div class="step-num">1</div><h4>Configure</h4><p>Define source, target, and rules</p></div>
    <div class="arrow">→</div>
    <div class="step"><div class="step-num">2</div><h4>Discover</h4><p>Auto-discover validation controls</p></div>
    <div class="arrow">→</div>
    <div class="step"><div class="step-num">3</div><h4>Execute</h4><p>Run 9 controls, 27 rules</p></div>
    <div class="arrow">→</div>
    <div class="step"><div class="step-num">4</div><h4>Validate</h4><p>Real-time results and scoring</p></div>
    <div class="arrow">→</div>
    <div class="step"><div class="step-num">5</div><h4>Govern</h4><p>Decision tracking and audit</p></div>
    <div class="arrow">→</div>
    <div class="step"><div class="step-num">6</div><h4>Report</h4><p>Executive-ready dashboards</p></div>
  </div>
</body>
</html>
