<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Platform Banner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 500px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: #0B2447; display: flex; align-items: center; color: #fff; }
    .banner { padding: 0 120px; width: 100%; display: flex; align-items: center; justify-content: space-between; }
    .left { max-width: 600px; }
    .left h2 { font-size: 42px; font-weight: 700; margin-bottom: 12px; }
    .left h2 span { font-weight: 300; opacity: 0.8; }
    .left p { font-size: 16px; opacity: 0.8; line-height: 1.6; margin-bottom: 24px; }
    .cta { display: inline-block; background: #0078D4; color: #fff; padding: 12px 28px; border-radius: 8px; font-size: 14px; font-weight: 600; }
    .features { display: flex; gap: 24px; }
    .feat { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; min-width: 160px; text-align: center; }
    .feat h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .feat p { font-size: 12px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="left">
      <h2>Platform <span>Overview</span></h2>
      <p>End-to-end migration assurance with automated validation, governance, and risk assessment. Azure-native design for enterprise scale.</p>
      <div class="cta">See the Platform →</div>
    </div>
    <div class="features">
      <div class="feat"><h3>9</h3><p>Controls</p></div>
      <div class="feat"><h3>27</h3><p>Rules</p></div>
      <div class="feat"><h3>6</h3><p>Quality Dims</p></div>
      <div class="feat"><h3>100%</h3><p>Offline</p></div>
    </div>
  </div>
</body>
</html>
