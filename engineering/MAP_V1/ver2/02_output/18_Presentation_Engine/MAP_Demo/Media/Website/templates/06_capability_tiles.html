<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Capability Tiles</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 600px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: #F8F9FB; display: flex; align-items: center; justify-content: center; }
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; padding: 0 120px; max-width: 1400px; }
    .tile { background: #fff; border-radius: 12px; padding: 32px 24px; border: 1px solid #E5E7EB; text-align: center; }
    .tile-icon { width: 56px; height: 56px; background: #E8F0FE; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .tile-icon svg { width: 28px; height: 28px; stroke: #0078D4; fill: none; stroke-width: 2; }
    .tile h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: #0B2447; }
    .tile p { font-size: 13px; color: #6B7280; }
  </style>
</head>
<body>
  <div class="tiles">
    <div class="tile"><div class="tile-icon"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><h3>Validation</h3><p>Automated control execution</p></div>
    <div class="tile"><div class="tile-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><h3>Governance</h3><p>Audit trail and compliance</p></div>
    <div class="tile"><div class="tile-icon"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg></div><h3>Risk</h3><p>Assessment and mitigation</p></div>
    <div class="tile"><div class="tile-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div><h3>Quality</h3><p>Multi-dimensional analysis</p></div>
  </div>
</body>
</html>
