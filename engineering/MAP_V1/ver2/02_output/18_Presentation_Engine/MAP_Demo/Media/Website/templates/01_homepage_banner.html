<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Homepage Banner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 600px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: linear-gradient(135deg, #0078D4 0%, #003B75 100%); display: flex; align-items: center; color: #fff; }
    .banner { padding: 0 120px; max-width: 1200px; }
    .badge { display: inline-block; background: rgba(255,255,255,0.2); font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    h1 { font-size: 56px; font-weight: 700; margin-bottom: 8px; }
    h1 span { font-weight: 300; }
    .sub { font-size: 20px; opacity: 0.85; margin-bottom: 24px; }
    .cta { display: inline-block; background: #fff; color: #0078D4; padding: 14px 32px; border-radius: 8px; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="badge">Enterprise Data Migration</div>
    <h1>MAP <span>Nexus™</span></h1>
    <div class="sub">Migration Assurance Platform — Validate, Govern, Succeed</div>
    <div class="cta">Explore the Platform →</div>
  </div>
</body>
</html>
