<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Validation Centre Slide</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: #F8F9FB; padding: 60px; }
    .slide { width: 100%; height: 100%; display: flex; gap: 32px; }
    .left { flex: 1; display: flex; flex-direction: column; }
    .right { width: 600px; display: flex; flex-direction: column; gap: 20px; }
    .header { margin-bottom: 24px; }
    .header h2 { font-size: 42px; font-weight: 700; color: #0B2447; }
    .header h2 span { color: #0078D4; font-weight: 300; }
    .card { background: #fff; border-radius: 12px; padding: 24px; border: 1px solid #E5E7EB; flex: 1; }
    .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .donut { width: 200px; height: 200px; border-radius: 50%; background: conic-gradient(#D13438 0% 55.6%, #FFB900 55.6% 66.7%, #107C10 66.7% 88.9%, #9CA3AF 88.9% 100%); margin: 0 auto; position: relative; }
    .donut::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 120px; height: 120px; background: #fff; border-radius: 50%; }
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .kpi { background: #F3F4F6; border-radius: 8px; padding: 16px; text-align: center; }
    .kpi .val { font-size: 24px; font-weight: 700; }
    .kpi .lbl { font-size: 11px; color: #6B7280; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="left">
      <div class="header"><h2>Validation <span>Centre</span></h2></div>
      <div class="card">
        <h3>Validation Distribution</h3>
        <div class="donut"></div>
      </div>
    </div>
    <div class="right">
      <div class="card">
        <h3>Control Results</h3>
        <div class="kpi-grid">
          <div class="kpi"><div class="val">9</div><div class="lbl">Total Controls</div></div>
          <div class="kpi"><div class="val" style="color:#107C10;">2</div><div class="lbl">Passed</div></div>
          <div class="kpi"><div class="val" style="color:#FFB900;">1</div><div class="lbl">Failed</div></div>
          <div class="kpi"><div class="val" style="color:#D13438;">5</div><div class="lbl">Errors</div></div>
          <div class="kpi"><div class="val" style="color:#D13438;">1</div><div class="lbl">Blocked</div></div>
          <div class="kpi"><div class="val">27</div><div class="lbl">Total Rules</div></div>
        </div>
      </div>
      <div class="card">
        <h3>Recommendation</h3>
        <p style="font-size:14px;color:#424242;">DO NOT PROCEED with migration. Critical validation issues must be resolved.</p>
      </div>
    </div>
  </div>
</body>
</html>
