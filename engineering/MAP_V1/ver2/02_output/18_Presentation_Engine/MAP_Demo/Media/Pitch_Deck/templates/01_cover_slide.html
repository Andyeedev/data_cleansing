<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Cover Slide</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: linear-gradient(135deg, #0078D4 0%, #003B75 100%); display: flex; align-items: center; justify-content: center; color: #fff; }
    .slide { text-align: center; }
    .badge { display: inline-block; background: rgba(255,255,255,0.2); font-size: 14px; font-weight: 600; padding: 8px 20px; border-radius: 24px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 32px; }
    h1 { font-size: 80px; font-weight: 700; margin-bottom: 8px; }
    h1 span { font-weight: 300; }
    .sub { font-size: 28px; opacity: 0.85; margin-bottom: 48px; }
    .meta { font-size: 16px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="badge">Enterprise Data Migration Assurance</div>
    <h1>MAP <span>Nexus™</span></h1>
    <div class="sub">Migration Assurance Platform</div>
    <div class="meta">Enterprise Demonstration · July 2026</div>
  </div>
</body>
</html>
