<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>MAP Nexus™ — Dashboard Slide</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; background: #F8F9FB; padding: 60px; }
    .slide { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .header { margin-bottom: 32px; }
    .header h2 { font-size: 42px; font-weight: 700; color: #0B2447; }
    .header h2 span { color: #0078D4; font-weight: 300; }
    .dashboard { flex: 1; background: #fff; border-radius: 16px; border: 1px solid #E5E7EB; padding: 32px; display: flex; flex-direction: column; gap: 20px; }
    .kpi-row { display: flex; gap: 16px; }
    .kpi { flex: 1; background: #F3F4F6; border-radius: 10px; padding: 16px; text-align: center; }
    .kpi .val { font-size: 28px; font-weight: 700; color: #0078D4; }
    .kpi .lbl { font-size: 12px; color: #6B7280; }
    .charts { flex: 1; display: flex; gap: 16px; }
    .chart { flex: 1; background: #F3F4F6; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="header"><h2>Executive <span>Dashboard</span></h2></div>
    <div class="dashboard">
      <div class="kpi-row">
        <div class="kpi"><div class="val">9</div><div class="lbl">Controls</div></div>
        <div class="kpi"><div class="val" style="color:#107C10;">2</div><div class="lbl">Passed</div></div>
        <div class="kpi"><div class="val" style="color:#FFB900;">1</div><div class="lbl">Failed</div></div>
        <div class="kpi"><div class="val" style="color:#D13438;">5</div><div class="lbl">Errors</div></div>
        <div class="kpi"><div class="val" style="color:#D13438;">1</div><div class="lbl">Blocked</div></div>
        <div class="kpi"><div class="val">62%</div><div class="lbl">Readiness</div></div>
      </div>
      <div class="charts">
        <div class="chart"></div>
        <div class="chart"></div>
      </div>
    </div>
  </div>
</body>
</html>
