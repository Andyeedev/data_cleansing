<!DOCTYPE html>
<html>
<head>
    <title>Migration Governance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            margin: 20px;
        }
        .kpi-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .kpi {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            flex: 1;
            text-align: center;
        }
        .kpi h2 {
            margin: 0;
            font-size: 28px;
        }
        canvas {
            background: #1e293b;
            border-radius: 12px;
            padding: 10px;
        }
    </style>
</head>
<body>

<h1>Enterprise Migration Governance</h1>

<div class="kpi-container">
    <div class="kpi">
        <h3>Overall Pass Rate</h3>
        <h2 id="passRate"></h2>
    </div>
    <div class="kpi">
        <h3>Failure Rate</h3>
        <h2 id="failRate"></h2>
    </div>
    <div class="kpi">
        <h3>Blocked Batches</h3>
        <h2 id="blockedCount"></h2>
    </div>
    <div class="kpi">
        <h3>Avg Score</h3>
        <h2 id="avgScore"></h2>
    </div>
</div>

<canvas id="scoreTrend"></canvas>
<br><br>
<canvas id="severityChart"></canvas>
<br><br>
<canvas id="statusChart"></canvas>

<script>

// --- Synthetic Data Generation ---
const batches = 50;
let scores = [];
let statuses = {PASS:0, FAIL:0, BLOCKED:0};
let severityCounts = {LOW:0, MEDIUM:0, HIGH:0, CRITICAL:0};

for(let i=0;i<batches;i++){
    let score = Math.floor(Math.random()*40)+60;
    scores.push(score);

    if(score >= 90){
        statuses.PASS++;
    } else if(score >= 70){
        statuses.FAIL++;
    } else {
        statuses.BLOCKED++;
    }

    severityCounts.LOW += Math.floor(Math.random()*10);
    severityCounts.MEDIUM += Math.floor(Math.random()*6);
    severityCounts.HIGH += Math.floor(Math.random()*4);
    severityCounts.CRITICAL += Math.floor(Math.random()*2);
}

// KPIs
const passRate = ((statuses.PASS/batches)*100).toFixed(1);
const failRate = ((statuses.FAIL/batches)*100).toFixed(1);
const blockedCount = statuses.BLOCKED;
const avgScore = (scores.reduce((a,b)=>a+b)/batches).toFixed(1);

document.getElementById("passRate").innerText = passRate + "%";
document.getElementById("failRate").innerText = failRate + "%";
document.getElementById("blockedCount").innerText = blockedCount;
document.getElementById("avgScore").innerText = avgScore;

// Score Trend
new Chart(document.getElementById("scoreTrend"), {
    type: 'line',
    data: {
        labels: Array.from({length:batches},(_,i)=>"Batch "+(i+1)),
        datasets: [{
            label: "Batch Score",
            data: scores,
            borderColor: "#38bdf8",
            tension: 0.3
        }]
    }
});

// Severity Distribution
new Chart(document.getElementById("severityChart"), {
    type: 'bar',
    data: {
        labels: Object.keys(severityCounts),
        datasets: [{
            label: "Severity Count",
            data: Object.values(severityCounts),
            backgroundColor: ["#22c55e","#eab308","#f97316","#ef4444"]
        }]
    }
});

// Status Distribution
new Chart(document.getElementById("statusChart"), {
    type: 'pie',
    data: {
        labels: Object.keys(statuses),
        datasets: [{
            data: Object.values(statuses),
            backgroundColor: ["#22c55e","#f97316","#ef4444"]
        }]
    }
});

</script>

</body>
</html>
