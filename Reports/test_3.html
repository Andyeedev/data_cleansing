<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Style C - SaaS Modern</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fafafa; margin: 0; padding: 20px; }
  header { display: flex; align-items: center; margin-bottom: 20px; }
  .logo { width: 50px; height: 50px; background: #007bff; border-radius: 8px; margin-right: 15px; }
  h1 { font-size: 24px; color: #333; }
  .KPIs { display: flex; gap: 20px; margin-bottom: 20px; }
  .kpi { flex: 1; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .kpi h2 { font-size: 20px; margin-bottom: 8px; }
  .chart { height: 300px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <div style="font-size: 20px;">SaaS Dashboard</div>
</header>
<div class="KPIs">
  <div class="kpi"><h2>70%</h2><p>Success Rate</p></div>
  <div class="kpi"><h2>15</h2><p>Failures</p></div>
  <div class="kpi"><h2>85</h2><p>Avg Score</p></div>
</div>
<div class="chart">[Chart Placeholder]</div>
</body>
</html>
