<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Governance Intelligence</title>
<style>
body { font-family: Arial; background:#0f172a; color:white; padding:20px;}
.card { background:#1e293b; padding:20px; border-radius:8px; margin-bottom:20px;}
.metric { font-size:28px; font-weight:bold;}
.green{color:#22c55e;}
.red{color:#ef4444;}
</style>
</head>
<body>

<h1>Governance Intelligence</h1>

<div class="card">
    <div>Rolling Window</div>
    <div class="metric">5</div>
</div>

<div class="card">
    <div>Average Score (Last N)</div>
    <div class="metric">80%</div>
</div>

<div class="card">
    <div>Stability Score</div>
    <div class="metric">83.39</div>
</div>

<div class="card">
    <div>Risk Heat Index</div>
    <div class="metric">0</div>
</div>

<div class="card">
    <div>Anomaly Score</div>
    <div class="metric green">22.24</div>
    <div>Flag: FALSE</div>
    <div>Auto Blocked: FALSE</div>
</div>

</body>
</html>
