<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Style A - Corporate Minimal</title>
<style>
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; color: #333; }
  header { display: flex; align-items: center; margin-bottom: 20px; }
  .logo { width: 50px; height: 50px; background: #ccc; margin-right: 15px; }
  h1 { font-size: 24px; }
  .KPIs { display: flex; gap: 20px; margin-bottom: 20px; }
  .kpi { flex: 1; background: #f4f4f4; padding: 15px; border-radius: 4px; }
  .kpi h2 { font-size: 20px; margin-bottom: 8px; }
  .chart { height: 300px; background: #eaeaea; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #777; }
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>Corporate Dashboard</h1>
</header>
<div class="KPIs">
  <div class="kpi"><h2>70%</h2><p>Success Rate</p></div>
  <div class="kpi"><h2>15</h2><p>Failures</p></div>
  <div class="kpi"><h2>85</h2><p>Avg Score</p></div>
</div>
<div class="chart">[Chart Placeholder]</div>
</body>
</html>
