<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Migration Governance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--primary:#0b3d91;
--accent:#1e88e5;
--success:#2e7d32;
--danger:#c62828;
--warning:#f9a825;
--bg:#f4f6f9;
--card:#ffffff;
}

*{box-sizing:border-box;font-family:Segoe UI, sans-serif;}

body{margin:0;background:var(--bg);}

.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px 25px;
background:white;
border-bottom:1px solid #ddd;
}

.logo{
width:160px;
height:40px;
background:#e0e0e0;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
color:#666;
}

.banner{
padding:10px 25px;
font-weight:600;
}

.container{display:flex;min-height:calc(100vh - 110px);}

.sidebar{
width:260px;
background:white;
padding:20px;
border-right:1px solid #ddd;
}

.sidebar h3{font-size:13px;margin-bottom:8px;}

.segmented button{
width:100%;
padding:8px;
margin-bottom:5px;
border:1px solid #ddd;
background:#eee;
cursor:pointer;
}

.segmented button.active{
background:var(--primary);
color:white;
}

input{
width:100%;
padding:8px;
margin-bottom:10px;
}

button{
padding:10px;
border:none;
cursor:pointer;
}

.apply-btn{background:var(--primary);color:white;margin-bottom:10px;}
.clear-btn{background:#777;color:white;}

.main{flex:1;padding:25px;overflow-y:auto;}

.kpis{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:20px;
}

.kpi{
background:white;
padding:20px;
border-radius:6px;
text-align:center;
}

.kpi h2{margin:0;font-size:28px;}

.insight{
background:white;
padding:15px;
border-left:4px solid var(--primary);
margin-bottom:20px;
}

.charts{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.full-width{
grid-column:1 / -1;
height:380px;
}

.chart-box{
background:white;
padding:15px;
border-radius:6px;
height:350px;
}

canvas{width:100%!important;height:100%!important;}
</style>
</head>

<body>

<div class="header">
<div class="logo">LOGO</div>
<h2>Enterprise Migration Governance</h2>
<div id="confidenceDisplay"></div>
</div>

<div class="banner" id="healthBanner"></div>

<div class="container">

<div class="sidebar">

<h3>Environment</h3>
<div class="segmented" id="envFilter">
<button data-value="ALL" class="active">ALL</button>
<button data-value="DEV">DEV</button>
<button data-value="UAT">UAT</button>
<button data-value="PROD">PROD</button>
</div>

<h3>Status</h3>
<div class="segmented" id="statusFilter">
<button data-value="ALL" class="active">ALL</button>
<button data-value="PASS">PASS</button>
<button data-value="FAIL">FAIL</button>
<button data-value="BLOCKED">BLOCKED</button>
</div>

<h3>Date Range</h3>
<input type="date" id="dateFrom">
<input type="date" id="dateTo">

<button class="apply-btn" onclick="applyFilters()">Apply Filters</button>
<button class="clear-btn" onclick="clearFilters()">Clear Filters</button>

</div>

<div class="main">

<div class="kpis">
<div class="kpi"><h2 id="totalBatches">0</h2>Validation Volume</div>
<div class="kpi"><h2 id="approvalRate">0%</h2>Release Approval %</div>
<div class="kpi"><h2 id="avgScore">0</h2>Governance Quality Score</div>
<div class="kpi"><h2 id="blockedCount">0</h2>Blocked Releases</div>
</div>

<div class="insight" id="insightBox">
Executive insights will appear here.
</div>

<div class="charts">

<div class="chart-box full-width">
<canvas id="trendChart"></canvas>
</div>

<div class="chart-box">
<canvas id="statusChart"></canvas>
</div>

<div class="chart-box">
<canvas id="severityChart"></canvas>
</div>

<div class="chart-box">
<canvas id="controlChart"></canvas>
</div>

</div>
</div>
</div>

<script>

/* Synthetic Data */
const rawData = [
{env:"DEV",status:"PASS",score:100,date:"2026-02-10",severity:"LOW"},
{env:"DEV",status:"FAIL",score:66.7,date:"2026-02-11",severity:"HIGH"},
{env:"UAT",status:"PASS",score:100,date:"2026-02-12",severity:"LOW"},
{env:"PROD",status:"BLOCKED",score:44.4,date:"2026-02-13",severity:"CRITICAL"},
{env:"PROD",status:"PASS",score:100,date:"2026-02-14",severity:"LOW"},
{env:"UAT",status:"FAIL",score:88.9,date:"2026-02-15",severity:"MEDIUM"}
];

/* Toggle */
document.querySelectorAll('.segmented button').forEach(btn=>{
btn.addEventListener('click',()=>{
const parent=btn.parentElement;
parent.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
});
});

/* Charts */
let trendChart=new Chart(document.getElementById("trendChart"),{
type:'line',
data:{labels:[],datasets:[{label:"Governance Score",data:[],borderColor:"#0b3d91",tension:.3}]}
});

let statusChart=new Chart(document.getElementById("statusChart"),{
type:'doughnut',
data:{labels:[],datasets:[{data:[],backgroundColor:["#2e7d32","#c62828","#f9a825"]}]}
});

let severityChart=new Chart(document.getElementById("severityChart"),{
type:'bar',
data:{labels:["LOW","MEDIUM","HIGH","CRITICAL"],datasets:[{data:[0,0,0,0],backgroundColor:"#1e88e5"}]}
});

let controlChart=new Chart(document.getElementById("controlChart"),{
type:'bar',
data:{labels:["C01","C02","C03"],datasets:[{data:[2,3,1],backgroundColor:"#c62828"}]}
});

/* Filters */
function applyFilters(){

const env=document.querySelector('#envFilter .active').dataset.value;
const status=document.querySelector('#statusFilter .active').dataset.value;
const from=document.getElementById("dateFrom").value;
const to=document.getElementById("dateTo").value;

let filtered=rawData.filter(d=>{
return (env==="ALL"||d.env===env)&&
(status==="ALL"||d.status===status)&&
(!from||d.date>=from)&&
(!to||d.date<=to);
});

const total=filtered.length;
const approved=filtered.filter(d=>d.status==="PASS").length;
const avg=total?(filtered.reduce((a,b)=>a+b.score,0)/total).toFixed(2):0;
const blocked=filtered.filter(d=>d.status==="BLOCKED").length;

document.getElementById("totalBatches").innerText=total;
document.getElementById("approvalRate").innerText=total?((approved/total)*100).toFixed(1)+"%":"0%";
document.getElementById("avgScore").innerText=avg;
document.getElementById("blockedCount").innerText=blocked;

/* Confidence Score */
const confidence=( (approved/ (total||1))*0.4*100 ) + (avg*0.4) + ( (1-(blocked/(total||1)))*20 );
document.getElementById("confidenceDisplay").innerText="Confidence Score: "+confidence.toFixed(1);

/* Banner */
let banner=document.getElementById("healthBanner");
if(confidence>=85){banner.style.background="#e8f5e9";banner.innerText="RELEASE HEALTH: STABLE";}
else if(confidence>=65){banner.style.background="#fff8e1";banner.innerText="RELEASE HEALTH: MONITORING REQUIRED";}
else{banner.style.background="#ffebee";banner.innerText="RELEASE HEALTH: RELEASE BLOCKED";}

/* Trend */
trendChart.data.labels=filtered.map(d=>d.date);
trendChart.data.datasets[0].data=filtered.map(d=>d.score);
trendChart.update();

/* Status */
const statusCounts={
PASS:filtered.filter(d=>d.status==="PASS").length,
FAIL:filtered.filter(d=>d.status==="FAIL").length,
BLOCKED:filtered.filter(d=>d.status==="BLOCKED").length
};
statusChart.data.labels=Object.keys(statusCounts);
statusChart.data.datasets[0].data=Object.values(statusCounts);
statusChart.update();

/* Severity */
const sevCount={LOW:0,MEDIUM:0,HIGH:0,CRITICAL:0};
filtered.forEach(d=>sevCount[d.severity]++);
severityChart.data.datasets[0].data=Object.values(sevCount);
severityChart.update();

/* Insight Engine */
let topEnv=filtered.length?filtered.reduce((a,b)=>{
a[b.env]=(a[b.env]||0)+1;return a;},{ }):{};
let highestEnv=Object.keys(topEnv).sort((a,b)=>topEnv[b]-topEnv[a])[0]||"N/A";

document.getElementById("insightBox").innerText=
"Approval rate is "+(approved/(total||1)*100).toFixed(1)+"%. "+
"Primary activity concentrated in "+highestEnv+". "+
blocked+" release(s) currently blocked.";
}

function clearFilters(){
document.querySelectorAll('.segmented button').forEach(b=>b.classList.remove('active'));
document.querySelectorAll('#envFilter button')[0].classList.add('active');
document.querySelectorAll('#statusFilter button')[0].classList.add('active');
document.getElementById("dateFrom").value="";
document.getElementById("dateTo").value="";
applyFilters();
}

applyFilters();

</script>
</body>
</html>
