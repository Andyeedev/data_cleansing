<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Enterprise Dashboard</title>
<!-- Include Chart.js CDN for sample charts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  /* Reset and base styles */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    height: 100vh;
    background-color: #f0f0f0;
  }

  /* Sidebar styles */
  #sidebar {
    width: 250px;
    background-color: #1E3A8A; /* Dark Blue */
    display: flex;
    flex-direction: column;
    padding: 10px;
    color: white;
  }

  /* Slicers styling */
  .slicer-group {
    margin-bottom: 20px;
  }

  .slicer-label {
    margin-bottom: 8px;
    font-weight: bold;
    font-size: 14px;
  }

  /* Power BI style slicers - toggle buttons or range sliders */
  .slicer {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* Toggle button style */
  .toggle-button {
    padding: 8px 12px;
    background-color: transparent;
    border: 2px solid white;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.3s, color 0.3s;
  }

  .toggle-button.selected {
    background-color: white;
    color: #1E3A8A;
  }

  /* Range slider style */
  input[type=range] {
    width: 100%;
  }

  /* Date filter style */
  #dateFilter {
    width: 100%;
  }

  /* Apply button */
  #applyBtn {
    background-color: #2563EB;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
    transition: background-color 0.3s;
  }

  #applyBtn:hover {
    background-color: #3B82F6;
  }

  /* Main content styles */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Header styles */
  #header {
    background-color: #0a2a66; /* Almost dark blue */
    color: white;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #header h1 {
    font-size: 20px;
    margin-left: 10px;
  }

  #logo {
    width: 50px;
    height: 50px;
    background-color: #fff;
    border-radius: 50%;
    margin-right: 10px;
  }

  /* KPIs styles */
  #kpis {
    display: flex;
    justify-content: space-around;
    padding: 10px 20px;
    background-color: #f9f9f9;
  }

  .kpi {
    flex: 1;
    margin: 0 10px;
    background-color: #ffffff;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 0 8px rgba(0,0,0,0.05);
    transition: box-shadow 0.3s;
  }

  .kpi:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }

  .kpi h2 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #1E3A8A;
  }

  .kpi p {
    font-size: 14px;
    color: #333;
  }

  /* Charts grid styles */
  #charts-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 0; /* No gaps */
    flex: 1;
  }

  .chart-container {
    padding: 10px;
    height: 100%;
  }

  /* Make sure charts fill their container */
  canvas {
    width: 100% !important;
    height: 100% !important;
  }

  /* Responsive adjustments */
  @media(max-width: 1200px){
    #charts-grid {
      grid-template-columns: 1fr;
      grid-template-rows: repeat(4, 1fr);
    }
  }
</style>
</head>
<body>
<!-- Sidebar with slicers -->
<div id="sidebar">
  <div class="slicer-group">
    <div class="slicer-label">Category Filter</div>
    <div class="slicer" id="categorySlicer">
      <button class="toggle-button" data-value="A">A</button>
      <button class="toggle-button" data-value="B">B</button>
      <button class="toggle-button" data-value="C">C</button>
    </div>
  </div>
  <div class="slicer-group">
    <div class="slicer-label">Segment Filter</div>
    <div class="slicer" id="segmentSlicer">
      <button class="toggle-button" data-value="X">X</button>
      <button class="toggle-button" data-value="Y">Y</button>
      <button class="toggle-button" data-value="Z">Z</button>
    </div>
  </div>
  <div class="slicer-group">
    <div class="slicer-label">Date Range</div>
    <input type="date" id="startDate" />
    <input type="date" id="endDate" />
    <button id="applyBtn">Apply Filters</button>
  </div>
</div>

<!-- Main content area -->
<div id="main">
  <!-- Header -->
  <div id="header">
    <div style="display:flex; align-items:center;">
      <div id="logo"></div>
      <h1>Enterprise Dashboard</h1>
    </div>
  </div>
  <!-- KPIs -->
  <div id="kpis">
    <div class="kpi">
      <h2 id="kpi1">100</h2>
      <p>Sales</p>
    </div>
    <div class="kpi">
      <h2 id="kpi2">75%</h2>
      <p>Conversion Rate</p>
    </div>
    <div class="kpi">
      <h2 id="kpi3">250</h2>
      <p>Customers</p>
    </div>
  </div>
  <!-- Charts in grid -->
  <div id="charts-grid">
    <div class="chart-container">
      <canvas id="chart1"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="chart2"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="chart3"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="chart4"></canvas>
    </div>
  </div>
</div>

<script>
  // Sample data for charts
  const sampleData = {
    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
    datasets: [
      {
        label: 'Sample Data 1',
        data: [12, 19, 3, 5, 2, 3],
        backgroundColor: 'rgba(30, 144, 255, 0.2)',
        borderColor: 'rgba(30, 144, 255, 1)',
        borderWidth: 1
      }
    ]
  };

  // Initialize charts
  const ctx1 = document.getElementById('chart1').getContext('2d');
  const ctx2 = document.getElementById('chart2').getContext('2d');
  const ctx3 = document.getElementById('chart3').getContext('2d');
  const ctx4 = document.getElementById('chart4').getContext('2d');

  const chart1 = new Chart(ctx1, {
    type: 'line',
    data: {...sampleData},
    options: {
      responsive: true,
      plugins: { legend: { display: false } }
    }
  });
  const chart2 = new Chart(ctx2, {
    type: 'bar',
    data: {...sampleData},
    options: {
      responsive: true,
      plugins: { legend: { display: false } }
    }
  });
  const chart3 = new Chart(ctx3, {
    type: 'pie',
    data: {...sampleData},
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom' } }
    }
  });
  const chart4 = new Chart(ctx4, {
    type: 'doughnut',
    data: {...sampleData},
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom' } }
    }
  });

  // Slicer button toggle functionality
  document.querySelectorAll('.toggle-button').forEach(btn => {
    btn.addEventListener('click', () => {
      // Toggle active state
      btn.classList.toggle('selected');
    });
  });

  // Apply filters button
  document.getElementById('applyBtn').addEventListener('click', () => {
    // Gather filter states
    const categoryBtns = document.querySelectorAll('#categorySlicer .toggle-button.selected');
    const segmentBtns = document.querySelectorAll('#segmentSlicer .toggle-button.selected');
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;

    // For demonstration: update KPIs randomly
    document.getElementById('kpi1').innerText = Math.floor(Math.random() * 200 + 50);
    document.getElementById('kpi2').innerText = (Math.random() * 100).toFixed(1) + '%';
    document.getElementById('kpi3').innerText = Math.floor(Math.random() * 300 + 50);

    // Update charts with new sample data (simulate filter effect)
    [chart1, chart2, chart3, chart4].forEach(chart => {
      chart.data.datasets[0].data = chart.data.datasets[0].data.map(() => Math.floor(Math.random() * 20 + 1));
      chart.update();
    });
  });
</script>
</body>
</html>
